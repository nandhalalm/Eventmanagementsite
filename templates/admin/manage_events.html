{% extends 'admin/base.html' %}

{% block content %}

<h2>Manage Events</h2>

<a href="{% url 'create_event' %}" class="btn btn-success mb-3">

Add Event

</a>

<table class="table table-striped">

<tr>

<th>Image</th>

<th>Title</th>

<th>Date</th>

<th>Venue</th>

<th>Fee</th>

<th>Action</th>

</tr>

{% for event in events %}

<tr>

<td>

<img src="{{ event.image.url }}" width="90">

</td>

<td>{{ event.title }}</td>

<td>{{ event.event_date }}</td>

<td>{{ event.venue }}</td>

<td>₹{{ event.registration_fee }}</td>

<td>

<a href="{% url 'edit_event' event.id %}" class="btn btn-warning btn-sm">

Edit

</a>

<a href="{% url 'delete_event' event.id %}" class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% endfor %}

</table>

{% endblock %}
