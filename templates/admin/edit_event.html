{% extends 'admin/base.html' %} 

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <!-- Premium Card Container -->
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                
                <!-- Elegant Card Header -->
                <div class="card-header bg-gradient bg-dark text-white p-4 border-0 position-relative">
                    <div class="d-flex align-items-center">
                        <div class="bg-primary bg-opacity-25 rounded-3 p-3 me-3 text-primary">
                            <i class="bi bi-pencil-square fs-3"></i>
                        </div>
                        <div>
                            <h2 class="h4 fw-bold mb-1 m-0 text-white">Edit Event Details</h2>
                            <p class="text-muted small mb-0">Modify information for: <strong class="text-white">{{ event.title }}</strong></p>
                        </div>
                    </div>
                </div>

                <!-- Form Body -->
                <div class="card-body p-4 p-sm-5 bg-light bg-opacity-50">
                    <form method="POST" enctype="multipart/form-data" class="needs-validation">
                        {% csrf_token %}

                        <!-- Section: Basic Info -->
                        <div class="mb-4">
                            <label class="form-label text-uppercase fs-7 text-muted fw-semibold tracking-wider mb-3">Event Overview</label>
                            
                            <div class="form-floating mb-3">
                                <input type="text" name="title" class="form-control border-0 shadow-sm rounded-3" id="title" value="{{ event.title }}" placeholder="Title">
                                <label for="title" class="text-muted"><i class="bi bi-type-h1 me-2"></i>Event Title</label>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" name="category" class="form-control border-0 shadow-sm rounded-3" id="category" value="{{ event.category }}" placeholder="Category">
                                        <label for="category" class="text-muted"><i class="bi bi-tags me-2"></i>Category</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" name="venue" class="form-control border-0 shadow-sm rounded-3" id="venue" value="{{ event.venue }}" placeholder="Venue">
                                        <label for="venue" class="text-muted"><i class="bi bi-geo-alt me-2"></i>Venue / Location</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Section: Date & Time -->
                        <div class="mb-4">
                            <label class="form-label text-uppercase fs-7 text-muted fw-semibold tracking-wider mb-3">Schedule & Deadlines</label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="date" name="event_date" class="form-control border-0 shadow-sm rounded-3" id="event_date" value="{{ event.event_date|date:'Y-m-d' }}">
                                        <label for="event_date" class="text-muted"><i class="bi bi-calendar-event me-2"></i>Event Date</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="time" name="event_time" class="form-control border-0 shadow-sm rounded-3" id="event_time" value="{{ event.event_time|time:'H:i' }}">
                                        <label for="event_time" class="text-muted"><i class="bi bi-clock me-2"></i>Event Time</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating mb-3">
                                        <input type="date" name="last_date" class="form-control border-0 shadow-sm rounded-3" id="last_date" value="{{ event.last_date|date:'Y-m-d' }}">
                                        <label for="last_date" class="text-muted"><i class="bi bi-calendar-x me-2"></i>Last Date to Register</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Section: Description & Assets -->
                        <div class="mb-4">
                            <label class="form-label text-uppercase fs-7 text-muted fw-semibold tracking-wider mb-3">Additional Details</label>
                            
                            <div class="form-floating mb-3">
                                <textarea name="description" class="form-control border-0 shadow-sm rounded-3" id="description" placeholder="Description" style="height: 120px">{{ event.description }}</textarea>
                                <label for="description" class="text-muted"><i class="bi bi-file-text me-2"></i>Event Description</label>
                            </div>

                            <!-- Media Management Row -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <div class="p-3 bg-white rounded-3 shadow-sm border border-dashed text-center h-100 d-flex flex-column justify-content-center align-items-center">
                                        <label class="form-label text-muted small mb-2 d-block fw-semibold"><i class="bi bi-image me-1 text-primary"></i>Event Image Management</label>
                                        
                                        {% if event.image %}
                                        <div class="position-relative mb-2 inline-block shadow-sm rounded-2 overflow-hidden bg-light" style="max-width: 120px;">
                                            <img src="{{ event.image.url }}" class="img-fluid d-block" alt="Current Image">
                                        </div>
                                        <span class="badge bg-secondary mb-3 fs-8 fw-normal">Current Image</span>
                                        {% endif %}
                                        
                                        <input class="form-control form-control-sm" type="file" name="image">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="p-3 bg-white rounded-3 shadow-sm border border-dashed text-center h-100 d-flex flex-column justify-content-center align-items-center">
                                        <label class="form-label text-muted small mb-2 d-block fw-semibold"><i class="bi bi-file-pdf me-1 text-danger"></i>Event Brochure Management</label>
                                        
                                        {% if event.brochure %}
                                        <div class="mb-3 text-center">
                                            <a href="{{ event.brochure.url }}" target="_blank" class="btn btn-outline-danger btn-xs px-2 py-1 rounded-2 shadow-sm text-decoration-none">
                                                <i class="bi bi-file-earmark-pdf-fill"></i> View Current Brochure
                                            </a>
                                        </div>
                                        {% endif %}
                                        
                                        <input class="form-control form-control-sm" type="file" name="brochure">
                                    </div>
                                </div>
                            </div>

                            <!-- Capacity & Pricing Row -->
                                                        <div class="row g-3">
                                <div class="col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="number" name="total_seats" class="form-control border-0 shadow-sm rounded-3" id="total_seats" value="{{ event.total_seats }}">
                                        <label for="total_seats" class="text-muted"><i class="bi bi-people me-2"></i>Total Seats</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="number" name="available_seats" class="form-control border-0 shadow-sm rounded-3" id="available_seats" value="{{ event.available_seats }}">
                                        <label for="available_seats" class="text-muted"><i class="bi bi-person-check me-2"></i>Available Seats</label>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="form-floating mb-3">
                                        <input type="number" step="0.01" name="registration_fee" class="form-control border-0 shadow-sm rounded-3" id="registration_fee" value="{{ event.registration_fee }}">
                                        <label for="registration_fee" class="text-muted"><i class="bi bi-currency-dollar me-2"></i>Fee ($)</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid mt-4 pt-2">
                            <button type="submit" class="btn btn-primary btn-lg py-3 rounded-3 fw-bold shadow border-0 bg-gradient text-uppercase tracking-wider transition-all">
                                <i class="bi bi-cloud-arrow-up-fill me-2"></i>Update Event
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .fs-7 { font-size: 0.75rem; }
    .fs-8 { font-size: 0.65rem; }
    .btn-xs { font-size: 0.75rem; padding: 0.25rem 0.5rem; }
    .tracking-wider { letter-spacing: 0.08em; }
    .border-dashed { border: 2px dashed #e3e6ec !important; }
    .form-control:focus { box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15) !important; border: 1px solid #0d6efd !important; }
    .transition-all { transition: all 0.2s ease-in-out; }
    .transition-all:hover { transform: translateY(-1px); filter: brightness(1.05); }
</style>

<link rel="stylesheet" href="https://jsdelivr.net">
{% endblock %}
