{% extends 'admin/base.html' %}

{% block content %}

<h2>System Report</h2>

<div class="row">

<div class="col-md-3">

<div class="card bg-primary text-white">

<div class="card-body">

<h3>{{ events }}</h3>

<p>Total Events</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-success text-white">

<div class="card-body">

<h3>{{ students }}</h3>

<p>Total Students</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-warning">

<div class="card-body">

<h3>{{ registrations }}</h3>

<p>Registrations</p>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-danger text-white">

<div class="card-body">

<h3>{{ payments }}</h3>

<p>Payments</p>

</div>

</div>

</div>

</div>

{% endblock %}
