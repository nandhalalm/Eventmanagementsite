<!DOCTYPE html>
<html>

<head>

    <title>Admin Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand" href="{% url 'admin_dashboard' %}">
Event Admin
</a>

<div>

<a class="btn btn-light" href="{% url 'admin_dashboard' %}">Dashboard</a>

<a class="btn btn-light" href="{% url 'manage_events' %}">Events</a>

<a class="btn btn-light" href="{% url 'view_registrations' %}">Registrations</a>

<a class="btn btn-light" href="{% url 'view_payments' %}">View Payments</a>


<a class="btn btn-light" href="{% url 'attendance' %}">Attendance</a>

<a class="btn btn-light" href="{% url 'reports' %}">Reports</a>

<a class="btn btn-light" href="{% url 'messages' %}">Messages</a>

<a class="btn btn-danger" href="{% url 'logout' %}">
Logout
</a>

</div>

</div>

</nav>

<div class="container mt-4">

{% if messages %}

{% for message in messages %}

<div class="alert alert-success">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% block content %}

{% endblock %}

</div>

</body>

</html>
