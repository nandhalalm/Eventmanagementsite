<!DOCTYPE html>
<html>

<head>
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: #F7F8FA;
        }

        .topbar {
            background: #14171C;
            border-bottom: 1px solid #14171C;
            box-shadow: 0 2px 10px rgba(16, 24, 40, 0.12);
        }

        .topbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 14px;
            padding-bottom: 14px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 1.25rem;
            color: #F3F5F8;
            text-decoration: none;
        }

        .brand:hover {
            color: #FFFFFF;
        }

        .brand-mark {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #5B8DEF;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-wrap: wrap;
        }

        .nav-links a {
            font-size: 0.92rem;
            font-weight: 500;
            color: #AEB6C4;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 7px;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .nav-links a:hover {
            background: #1F2430;
            color: #FFFFFF;
        }

        .nav-links a.logout {
            color: #E38A94;
            margin-left: 8px;
        }

        .nav-links a.logout:hover {
            background: #2A1B1D;
            color: #F2A3AC;
        }

        .page-alerts {
            margin-top: 24px;
        }

        .alert-success {
            border: 1px solid #CDEBDC;
            background: #F2FAF6;
            color: #1E7A4D;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="topbar">
    <div class="container">
        <a class="brand" href="{% url 'admin_dashboard' %}">
            <span class="brand-mark">E</span>
            Event Admin
        </a>

        <div class="nav-links">
            <a href="{% url 'admin_dashboard' %}">Dashboard</a>
            <a href="{% url 'manage_events' %}">Events</a>
            <a href="{% url 'view_registrations' %}">Registrations</a>
            <a href="{% url 'view_payments' %}">Payments</a>
            <a href="{% url 'attendance' %}">Attendance</a>
            <a href="{% url 'reports' %}">Reports</a>
            <a href="{% url 'messages' %}">Messages</a>
            <a class="logout" href="{% url 'logout' %}">Logout</a>
        </div>
    </div>
</div>

<div class="container mt-4">

    {% if messages %}
        <div class="page-alerts">
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

</body>

</html>
