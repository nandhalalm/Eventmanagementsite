{% extends 'admin/base.html' %}

{% block content %}

<h2>Contact Messages</h2>

<table class="table table-bordered">

<thead>

<tr>

<th>Name</th>

<th>Email</th>

<th>Subject</th>

<th>Message</th>

<th>Date</th>

</tr>

</thead>

<tbody>

{% for contact in contacts %}

<tr>

<td>{{ contact.name }}</td>

<td>{{ contact.email }}</td>

<td>{{ contact.subject }}</td>

<td>{{ contact.message }}</td>

<td>{{ contact.created_at }}</td>

</tr>

{% endfor %}

</tbody>

</table>

{% endblock %}
