{% extends 'user/base.html' %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<h2 class="mb-4">
    Welcome {{ request.user.first_name }}
</h2>

<div class="row">

    <div class="col-md-4">

        <div class="card text-center shadow">

            <div class="card-body">

                <i class="bi bi-calendar-event display-4 text-primary"></i>

                <h4 class="mt-3">

                    My Registrations

                </h4>

                <h2>

                    {{ registrations.count }}

                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card text-center shadow">

            <div class="card-body">

                <i class="bi bi-person-circle display-4 text-success"></i>

                <h4 class="mt-3">

                    My Profile

                </h4>

                <a href="{% url 'profile' %}" class="btn btn-success mt-3">

                    View Profile

                </a>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card text-center shadow">

            <div class="card-body">

                <i class="bi bi-ticket-perforated display-4 text-danger"></i>

                <h4 class="mt-3">

                    Browse Events

                </h4>

                <a href="{% url 'event_list' %}" class="btn btn-primary mt-3">

                    View Events

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
