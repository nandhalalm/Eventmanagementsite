{% if user.is_authenticated %}

    {% if already_registered %}

        <button class="btn btn-secondary">

            Already Registered

        </button>

    {% else %}

        <a href="{% url 'register_event' event.id %}"
           class="btn btn-success">

            Register Now

        </a>

    {% endif %}

{% else %}

    <a href="{% url 'login' %}"
       class="btn btn-primary">

        Login to Register

    </a>

{% endif %}
