{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Login</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<input class="form-control mb-3"

type="text"

name="username"

placeholder="Username"

required>

<input class="form-control mb-3"

type="password"

name="password"

placeholder="Password"

required>

<button class="btn btn-success w-100">

Login

</button>

</form>

</div>

</div>

</div>

</div>

{% endblock %}
