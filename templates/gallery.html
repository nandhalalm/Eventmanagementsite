
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Preview</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#EDEBF5;
    --indigo:#4A3FBF;
    --indigo-deep:#12102A;
    --coral:#FF6B54;
    --gold:#FFC24B;
    --paper:#0E0C22;
    --surface:#181530;
    --line:#2C2850;
    --muted:#9491AE;
  }
  body{ font-family:'Inter', sans-serif; color:var(--ink); background:var(--paper); }

  .gallery-head{ display:flex; align-items:flex-end; justify-space-between:flex-wrap; flex-wrap:wrap; gap:1rem; margin:2.5rem 0 2rem; }
  .gallery-head .eyebrow{ font-family:'Space Grotesk', sans-serif; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--coral); margin-bottom:.4rem; display:block; }
  .gallery-head h2{ font-family:'Space Grotesk', sans-serif; font-weight:700; color:var(--ink); font-size:2rem; margin:0; }
  .gallery-head p{ font-family:'Inter', sans-serif; color:var(--muted); margin:.4rem 0 0; max-width:42ch; }

  .filmstrip{ position:relative; overflow:hidden; border-radius:16px; margin-bottom:3rem; background:var(--indigo-deep); padding:14px 0; border:1px solid var(--line); }
  .filmstrip::before, .filmstrip::after{ content:""; position:absolute; top:0; bottom:0; width:70px; z-index:2; pointer-events:none; }
  .filmstrip::before{ left:0; background:linear-gradient(90deg, var(--indigo-deep), transparent); }
  .filmstrip::after{ right:0; background:linear-gradient(270deg, var(--indigo-deep), transparent); }
  .filmstrip-track{ display:flex; gap:14px; width:max-content; animation:scrollStrip 38s linear infinite; }
  .filmstrip:hover .filmstrip-track{ animation-play-state:paused; }
  .filmstrip-track img{ height:150px; width:220px; object-fit:cover; border-radius:10px; flex:none; filter:saturate(0.95); transition:transform .3s ease, filter .3s ease; }
  .filmstrip-track img:hover{ transform:scale(1.04); filter:saturate(1.1); }
  @keyframes scrollStrip{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

  .masonry{ column-count:1; column-gap:1rem; }
  @media (min-width:576px){ .masonry{ column-count:2; } }
  @media (min-width:768px){ .masonry{ column-count:3; } }
  @media (min-width:992px){ .masonry{ column-count:4; } }

  .masonry-item{ break-inside:avoid; margin-bottom:1rem; border-radius:14px; overflow:hidden; position:relative; cursor:zoom-in;
    background:var(--surface); border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(0,0,0,0.25), 0 8px 20px rgba(0,0,0,0.3); transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease; }
  .masonry-item:hover{ transform:translateY(-4px); box-shadow:0 16px 34px rgba(0,0,0,0.45); border-color:var(--coral); }
  .masonry-item img{ width:100%; display:block; transition:transform .4s ease; opacity:.92; }
  .masonry-item:hover img{ transform:scale(1.05); opacity:1; }
  .masonry-item .tag{
    position:absolute; left:10px; bottom:10px;
    font-family:'Space Grotesk', sans-serif; font-size:.72rem; font-weight:600; letter-spacing:.03em;
    color:#fff; background:rgba(10,8,26,0.75); padding:.3rem .7rem; border-radius:999px;
    backdrop-filter: blur(4px);
  }
  .masonry-item .zoom-hint{ position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
    background:rgba(10,8,26,0.6); color:#fff; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .2s ease; }
  .masonry-item:hover .zoom-hint{ opacity:1; }

  .lightbox{ position:fixed; inset:0; background:rgba(5,4,14,0.96); display:none; align-items:center; justify-content:center; z-index:2000; padding:2rem; }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:90vw; max-height:85vh; border-radius:10px; box-shadow:0 20px 60px rgba(0,0,0,0.7); object-fit:contain; }
  .lightbox-close, .lightbox-nav{ position:absolute; background:rgba(255,255,255,0.08); border:1px solid var(--line); color:#fff; width:44px; height:44px;
    border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.3rem; cursor:pointer; transition:background .18s ease; }
  .lightbox-close:hover, .lightbox-nav:hover{ background:var(--coral); border-color:var(--coral); }
  .lightbox-close{ top:1.5rem; right:1.5rem; }
  .lightbox-nav.prev{ left:1.5rem; top:50%; transform:translateY(-50%); }
  .lightbox-nav.next{ right:1.5rem; top:50%; transform:translateY(-50%); }

  footer.site-footer{ background:var(--indigo-deep); border-top:1px solid var(--line); font-family:'Inter', sans-serif; font-size:.85rem; color:var(--muted); letter-spacing:.02em; }

  /* ---------- Navbar ---------- */
  .site-nav{
    background:var(--indigo-deep);
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    z-index:1000;
  }
  .site-nav .inner{
    max-width:1200px; margin:0 auto; padding:0 1.5rem;
    display:flex; align-items:center; justify-content:space-between; height:68px;
  }
  .site-nav .brand{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:1.15rem;
    color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:.55rem; letter-spacing:-.01em;
  }
  .site-nav .brand::before{
    content:""; width:9px; height:9px; border-radius:50%;
    background:var(--coral); box-shadow:0 0 0 4px rgba(255,107,84,0.18);
  }
  .site-nav .nav-links{ display:flex; align-items:center; gap:2rem; list-style:none; margin:0; padding:0; }
  .site-nav .nav-links a{
    font-family:'Inter', sans-serif; font-size:.92rem; font-weight:500;
    color:var(--muted); text-decoration:none; position:relative; padding:.3rem 0; transition:color .15s ease;
  }
  .site-nav .nav-links a:hover{ color:var(--ink); }
  .site-nav .nav-links a::after{
    content:""; position:absolute; left:0; bottom:-2px; width:0; height:2px;
    background:var(--coral); transition:width .2s ease;
  }
  .site-nav .nav-links a:hover::after, .site-nav .nav-links a.active::after{ width:100%; }
  .site-nav .nav-links a.active{ color:var(--ink); }
  .site-nav .nav-actions{ display:flex; align-items:center; gap:1.1rem; }
  .site-nav .nav-actions .login-link{
    font-family:'Inter', sans-serif; font-size:.9rem; font-weight:500;
    color:var(--muted); text-decoration:none; transition:color .15s ease;
  }
  .site-nav .nav-actions .login-link:hover{ color:var(--ink); }
  .site-nav .nav-actions .btn-register{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:.88rem;
    color:#fff; background:var(--coral); padding:.55rem 1.3rem; border-radius:999px;
    text-decoration:none; box-shadow:0 6px 16px rgba(255,107,84,0.3);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .site-nav .nav-actions .btn-register:hover{
    background:#ff8069; color:#fff; transform:translateY(-1px); box-shadow:0 10px 22px rgba(255,107,84,0.4);
  }
  .nav-toggle{ display:none; background:none; border:none; color:var(--ink); font-size:1.4rem; }
  @media (max-width: 860px){
    .site-nav .nav-links{
      position:absolute; top:68px; left:0; right:0; background:var(--indigo-deep);
      flex-direction:column; align-items:flex-start; gap:0; padding:.5rem 1.5rem 1rem;
      display:none; border-bottom:1px solid var(--line);
    }
    .site-nav .nav-links.open{ display:flex; }
    .site-nav .nav-links a{ padding:.7rem 0; width:100%; }
    .nav-toggle{ display:block; }
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div class="inner">
    <a href="#" class="brand">EventHub</a>

    <ul class="nav-links" id="navLinks">
      <li><a href="{% url 'home' %}">Home</a></li>
      <li><a href="{% url 'about' %}">About</a></li>
      <li><a href="{% url 'event_list' %}">Events</a></li>
      <li><a href="{% url 'gallery' %}" class="active">Gallery</a></li>
      <li><a href="{% url 'contact' %}">Contact</a></li>
    </ul>

    <div class="nav-actions">
      <a href="{% url 'login' %}" class="login-link">Login</a>
      <a href="{% url 'logout' %}" class="btn-register">Register</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">&#9776;</button>
    </div>
  </div>
</nav>

<div class="container">

  <div class="gallery-head">
    <div>
      <span class="eyebrow">Moments from campus — preview data</span>
      <h2>Gallery</h2>
      <p>Real event photos across Technical, Cultural, Sports, and Workshop events for previewing the gallery layout.</p>
    </div>
  </div>

  <!-- Auto-scrolling filmstrip -->
  <div class="filmstrip">
    <div class="filmstrip-track" id="filmstripTrack"></div>
  </div>

  <!-- Masonry grid with lightbox -->
  <div class="masonry" id="masonryGrid"></div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <button class="lightbox-nav prev" onclick="stepLightbox(-1)">&#8249;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-nav next" onclick="stepLightbox(1)">&#8250;</button>
  </div>

</div>

<footer class="site-footer text-center mt-5 p-3">
  © 2026 College Event Management System — photo gallery preview
</footer>

<script>
  // High-quality photos curated from Unsplash matching campus event categories
  const events = [
    { name: 'Sports Day', category: 'Sports', img: 'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600&auto=format&fit=crop' },
    { name: 'Football Match', category: 'Sports', img:'https://images.unsplash.com/photo-1434648957308-5e6a859697e8?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8Zm9vdGJhbGx8ZW58MHx8MHx8fDA%3D'},
    { name: 'Cricket Match', category: 'Sports', img: 'https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=600&auto=format&fit=crop' },
    { name: 'Basketball Finals', category: 'Sports', img: 'https://images.unsplash.com/photo-1546519638-68e109498ffc?w=600&auto=format&fit=crop' },
    { name: 'Technical Coding Contest', category: 'Technical', img: 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format&fit=crop' },
    { name: 'Hackathon', category: 'Technical', img: 'https://images.unsplash.com/photo-1531482615713-2afd69097998?w=600&auto=format&fit=crop' },
    { name: 'Robotics Workshop', category: 'Technical', img: 'https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=600&auto=format&fit=crop' },
    { name: 'Tech Fest Exhibition', category: 'Technical', img: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&auto=format&fit=crop' },
    { name: 'Cultural Night', category: 'Cultural', img: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=600&auto=format&fit=crop' },
    { name: 'Dance Performance', category: 'Cultural', img: 'https://images.unsplash.com/photo-1547153760-18fc86324498?w=600&auto=format&fit=crop' },
    { name: 'Music Concert', category: 'Cultural', img: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop' },
    { name: 'Drama & Theatre', category: 'Cultural', img: 'https://images.unsplash.com/photo-1469488865564-c2de10f69f96?w=600&auto=format&fit=crop' },
    { name: 'Annual Day Celebration', category: 'Festive', img: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=600&auto=format&fit=crop' },
    { name: 'Freshers Party', category: 'Festive', img: 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=600&auto=format&fit=crop' },
    { name: 'Diwali Celebration', category: 'Festive', img: 'https://images.unsplash.com/photo-1666352571312-db1557140bc4?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTh8fGRlZXBhd2FsaXxlbnwwfHwwfHx8MA%3D%3D' },
    { name: 'Farewell Event', category: 'Festive', img: 'https://images.unsplash.com/photo-1523580494863-6f3031224c94?w=600&auto=format&fit=crop' },
    { name: 'Term Paper Presentation', category: 'Academic', img: 'https://images.unsplash.com/photo-1475721027785-f74eccf877e2?w=600&auto=format&fit=crop' },
    { name: 'Guest Lecture', category: 'Academic', img: 'https://images.unsplash.com/photo-1524178232363-1fb2b075b655?w=600&auto=format&fit=crop' },
    { name: 'Poster Presentation', category: 'Academic', img: 'https://images.unsplash.com/photo-1515187029135-18ee286d815b?w=600&auto=format&fit=crop' },
    { name: 'Project Expo', category: 'Academic', img: 'https://images.unsplash.com/photo-1552664730-d307ca884978?w=600&auto=format&fit=crop' },
    { name: 'Photography Workshop', category: 'Workshop', img: 'https://images.unsplash.com/photo-1542038784456-1ea8e935640e?w=600&auto=format&fit=crop' },
    { name: 'Entrepreneurship Workshop', category: 'Workshop', img: 'https://images.unsplash.com/photo-1556761175-5973dc0f32e7?w=600&auto=format&fit=crop' },
    { name: 'AI/ML Bootcamp', category: 'Workshop', img: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=600&auto=format&fit=crop' },
    { name: 'Public Speaking Workshop', category: 'Workshop', img: 'https://images.unsplash.com/photo-1544531586-fde5298cdd40?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8c3BlYWtlciUyMG9uJTIwc3RhZ2V8ZW58MHx8MHx8fDA%3D' },
  ];

  const photos = events.map(ev => ({
    url: ev.img,
    strip: ev.img,
    tag: `${ev.category} • ${ev.name}`
  }));

  const track = document.getElementById('filmstripTrack');
  const grid = document.getElementById('masonryGrid');

  function stripImg(p){
    const img = document.createElement('img');
    img.src = p.strip;
    img.alt = p.tag;
    return img;
  }

  // Filmstrip: render photos twice back-to-back for a seamless auto-scroll loop
  [...photos, ...photos].forEach(p => track.appendChild(stripImg(p)));

  // Masonry grid
  photos.forEach((p, index) => {
    const item = document.createElement('div');
    item.className = 'masonry-item';
    item.onclick = () => openLightbox(index);
    item.innerHTML = `
      <img src="${p.url}" alt="${p.tag}">
      <span class="tag">${p.tag}</span>
      <span class="zoom-hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
      </span>`;
    grid.appendChild(item);
  });

  const lightboxImages = photos.map(p => p.url);
  let currentIndex = 0;

  function openLightbox(index){
    currentIndex = index;
    document.getElementById('lightbox-img').src = lightboxImages[currentIndex];
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
  }
  function stepLightbox(delta){
    currentIndex = (currentIndex + delta + lightboxImages.length) % lightboxImages.length;
    document.getElementById('lightbox-img').src = lightboxImages[currentIndex];
  }
  document.addEventListener('keydown', function(e){
    if(!document.getElementById('lightbox').classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowRight') stepLightbox(1);
    if(e.key === 'ArrowLeft') stepLightbox(-1);
  });
  document.getElementById('lightbox').addEventListener('click', function(e){
    if(e.target === this) closeLightbox();
  });

  document.getElementById('navToggle')?.addEventListener('click', function(){
    document.getElementById('navLinks').classList.toggle('open');
  });
</script>

</body>
</html>
